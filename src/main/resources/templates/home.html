<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Gestión de Stock</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, rgba(64, 144, 203, 0.8) 0%, rgba(91, 192, 222, 0.8) 50%, rgba(175, 221, 233, 0.8) 100%), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%234090CF"/><path d="M0 50 Q 25 30, 50 50 T 100 50 L100 100 L0 100 Z" fill="%235BC0DE" opacity="0.6"/><path d="M0 30 Q 25 10, 50 30 T 100 30 L100 100 L0 100 Z" fill="%23AFDDE9" opacity="0.4"/></svg>');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .sidebar.collapsed {
            width: 60px;
        }
        .main-content {
            margin-left: 250px;
            padding: 40px;
            transition: all 0.3s ease;
        }
        .main-content.collapsed {
            margin-left: 60px;
        }
        .btn-toggle {
            position: absolute;
            top: 10px;
            right: -20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
        }
        .nav-link {
            color: #2c3e50;
            padding: 10px;
            display: block;
            text-decoration: none;
            transition: background 0.3s;
        }
        .nav-link:hover {
            background: rgba(52, 152, 219, 0.1);
            border-radius: 5px;
        }
        .user-info {
            background: rgba(52, 152, 219, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        .role-badge {
            font-size: 16px;
            padding: 8px 15px;
            border-radius: 20px;
        }
        .stock-alert {
            background: rgba(23, 162, 184, 0.9);
            border: 2px solid #0d6efd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .stock-alert h4 {
            color: #dc3545;
            margin-bottom: 15px;
            border-bottom: 2px solid #dc3545;
            padding-bottom: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }
        .stock-alert h4::before {
            content: "⚠";
            font-size: 1.5em;
        }
        .stock-alert ul {
            margin-bottom: 0;
        }
        .stock-alert li {
            margin-bottom: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            border-left: 4px solid #dc3545;
            color: #212529;
        }
        .stock-alert .product-name {
            color: #dc3545;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }
        .stock-alert .stock-info {
            color: #000;
            font-weight: bold;
        }
        .stock-alert .sku {
            color: #495057;
            font-family: monospace;
            background: rgba(255, 255, 255, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="sidebar" id="sidebar">
    <button class="btn-toggle" onclick="toggleSidebar()">↔</button>
    <div class="user-info">
        <h4>Bienvenido, <span th:text="${usuario.nombre}"></span></h4>
        <p>Rol: <span class="badge role-badge bg-primary" th:text="${usuario.rol}"></span></p>
    </div>
    <nav>
        <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'GERENTE')">
            <a href="/agregar-producto" class="nav-link">Agregar Producto Nuevo</a>
        </div>
        <a href="/ingreso" class="nav-link">Ingreso de Stock</a>
        <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'GERENTE', 'EMPLEADO')">
            <a href="/desperdicio" class="nav-link">Desperdicio / Roturas</a>
        </div>
        <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'GERENTE')">
            <a href="/reporte/semanal" class="nav-link">Reportes Semanales</a>
        </div>
        <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'GERENTE')">
            <a href="/egreso" class="nav-link">Egreso de Stock</a>
        </div>
        <a href="/productos" class="nav-link">Lista de Productos</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="nav-link btn btn-danger w-100">Cerrar Sesión</button>
        </form>
    </nav>
</div>
<div class="main-content" id="main-content">
    <h2>Traversol</h2>
    <p>Bordes Atermicos para Piscinas</p>

    <!-- Alerta de Stock Mínimo-->
    <div th:if="${!productosBajos.isEmpty()}" class="stock-alert">
        <h4>ALERTA DE STOCK MÍNIMO</h4>
        <ul>
            <li th:each="producto : ${productosBajos}">
                Producto <span class="product-name" th:text="${producto.nombre}"></span>
                  tiene solo <span class="stock-info" th:text="${producto.stockActual}"></span> unidades
                  (mínimo requerido: <span class="stock-info" th:text="${producto.stockMinimo}"></span>).
              </li>
          </ul>
      </div>
  </div>
  <script>
      function toggleSidebar() {
          document.getElementById('sidebar').classList.toggle('collapsed');
          document.getElementById('main-content').classList.toggle('collapsed');
      }
  </script>
  </body>
  </html>
