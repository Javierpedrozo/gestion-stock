<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reporte Semanal de Stock</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Reporte Semanal de Stock</h2>
    <p>Período: <span th:text="${reporte.inicio}"></span> a <span th:text="${reporte.fin}"></span></p>

    <h3>Totales</h3>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Tipo</th>
            <th>Total Cantidad</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Ingresos</td>
            <td th:text="${reporte.totales.get('INGRESO')}"></td>
        </tr>
        <tr>
            <td>Egresos</td>
            <td th:text="${reporte.totales.get('EGRESO')}"></td>
        </tr>
        <tr>
            <td>Desperdicios/Roturas</td>
            <td th:text="${reporte.totales.get('DESPERDICIO')}"></td>
        </tr>
        </tbody>
    </table>

    <h3>Detalles de Transacciones</h3>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Fecha</th>
            <th>Usuario</th>
            <th>Motivo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${reporte.transacciones}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.tipo.name()}"></td> <!-- Usa .name() para el enum -->
            <td th:text="${t.producto.nombre}"></td> <!-- Asume que Producto tiene 'nombre' -->
            <td th:text="${t.cantidad}"></td>
            <td th:text="${t.fecha}"></td>
            <td th:text="${t.usuario.username}"></td>
            <td th:text="${t.motivo ?: 'N/A'}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
